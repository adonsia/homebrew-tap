name: Test tap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater:
    name: Validate updater
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Set up Homebrew and tap
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax
      - name: Install and test formulae
        run: |
          tap_dir="$(brew --repository adonsia/tap)"
          shopt -s nullglob
          for file in "$tap_dir"/Formula/*.rb; do
            formula="adonsia/tap/$(basename "$file" .rb)"
            if [[ "$RUNNER_OS" == Linux ]] && brew info --json=v2 "$formula" | ruby -rjson -e 'exit(JSON.parse(STDIN.read)["formulae"].first.fetch("requirements", []).any? { |r| r["name"] == "macos" } ? 0 : 1)'; then
              echo "Skipping macOS-only formula: $formula"
              continue
            fi
            brew install --build-from-source "$formula"
            brew test "$formula"
            brew audit "$formula"
          done
      - name: Audit casks
        if: runner.os == 'macOS'
        run: |
          tap_dir="$(brew --repository adonsia/tap)"
          shopt -s nullglob
          for file in "$tap_dir"/Casks/*.rb; do
            brew audit --cask "adonsia/tap/$(basename "$file" .rb)"
          done
